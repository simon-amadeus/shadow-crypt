[package]
name = "shadow-crypt"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = [
    ".github/",
    ".gitignore",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

# All binaries from workspace
[[bin]]
name = "shadow"
path = "src/bin/encryption.rs"

[[bin]]
name = "shadows"
path = "src/bin/listing.rs"

[[bin]]
name = "unshadow"
path = "src/bin/decryption.rs"

[dependencies]
shadow-crypt-core = { version = "2", path = "crates/shadow-crypt-core" }
shadow-crypt-shell = { version = "2", path = "crates/shadow-crypt-shell" }

[dev-dependencies]
tempfile = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/shadow-crypt-core",
    "crates/shadow-crypt-shell",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Simon Amadeus <code@simonamadeus.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/simon-amadeus/shadow-crypt"
readme = "README.md"
description = "Secure password-based file encryption with filename obfuscation"
documentation = "https://docs.rs/shadow-crypt"
keywords = ["encryption", "cryptography", "file", "security", "cli"]
categories = ["command-line-utilities", "cryptography"]

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

[workspace.dependencies]
zeroize = "1"
chacha20poly1305 = "0.11"
argon2 = "0.6"
rand = { version = "0.10", features = ["sys_rng"] }
subtle = "2"
rayon = "1"

# I/O and CLI dependencies for shadow-shell
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zxcvbn = "3"
colored = "3"

# Error handling
thiserror = "2"

# Testing
tempfile = "3"
proptest = "1"
