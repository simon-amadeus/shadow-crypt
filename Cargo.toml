[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptographic libraries
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"

# Secure memory handling
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.6", features = ["zeroize_derive"] }

# Data serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
base64 = "0.21"

# File operations and paths
tempfile = "3.8"
walkdir = "2.4"
filetime = "0.2"

# Parallel processing
rayon = "1.7"

# Command line interface
clap = { version = "4.4", features = ["derive"] }
rpassword = "7.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future features)
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
# Testing
proptest = "1.3"
mockall = "0.11"
criterion = "0.5"

[features]
default = []
async = ["tokio"]
