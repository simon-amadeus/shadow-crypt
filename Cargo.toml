# Shadow Crypt - Secure File Encryption Tool

[package]
name = "shadow-crypt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simple file encryption tools"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# All binaries from workspace
[[bin]]
name = "shadow"
path = "src/bin/shadow.rs"

[[bin]]
name = "unshadow"
path = "src/bin/unshadow.rs"

[dependencies]
# Only depend on what the main binary actually needs
shadow-shell = { path = "crates/shadow-shell" }

[dev-dependencies]
tempfile = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/shadow-core",
    "crates/shadow-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Simon Amadeus <code@simonamadeus.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/simon-amadeus/shadow-crypt"
readme = "README.md"
keywords = ["encryption", "cryptography", "file", "security", "cli"]
categories = ["command-line-utilities", "cryptography"]

[workspace.dependencies]
zeroize = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "rng"] }
rand = { version = "0.9", features = ["os_rng"] }
subtle = "2"

# I/O and CLI dependencies for shadow-shell
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zxcvbn = "3"
colored = "3"

# Error handling
thiserror = "2"

# Testing
tempfile = "3"
