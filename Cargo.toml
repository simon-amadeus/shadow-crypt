# Shadow Crypt - Secure File Encryption Tool

[package]
name = "shadow-crypt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simple file encryption tools"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# All binaries from workspace
[[bin]]
name = "shadow"
path = "src/bin/shadow.rs"

[dependencies]
# Only depend on what the main binary actually needs
shadow-encryption-shell = { path = "crates/shadow-encryption-shell" }

[workspace]
resolver = "2"
members = [
    "crates/shadow-core",              # Pure shared foundation (crypto, types, validation)
    "crates/shadow-shell",             # Shared I/O utilities (file ops, CLI helpers)
    "crates/shadow-encryption-core",   # Pure encryption business logic
    "crates/shadow-encryption-shell",  # Encryption I/O and CLI
    # Future crates will be added in subsequent phases:
    # "crates/shadow-decryption-core",   # Pure decryption business logic
    # "crates/shadow-decryption-shell",  # Decryption I/O and CLI
    # "crates/shadow-listing-core",      # Pure listing business logic
    # "crates/shadow-listing-shell",     # Listing I/O and CLI
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Simon Amadeus <code@simonamadeus.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/simon-amadeus/shadow"
readme = "README.md"
keywords = ["encryption", "cryptography", "file", "security", "cli"]
categories = ["command-line-utilities", "cryptography"]

[workspace.dependencies]
# Cryptographic dependencies for shadow-core
zeroize = "1.6"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.3"
subtle = "2.5"
uuid = { version = "1.10", features = ["v4", "rng"] }
rand = "0.8"
zxcvbn = "3"

# I/O and CLI dependencies for shadow-shell
clap = { version = "4", features = ["derive"] }
rpassword = "7.2"
tempfile = "3"
colored = "3.0"
atty = "0.2"

# Error handling
thiserror = "2.0"

# Development dependencies
criterion = "0.5"
proptest = "1.0"
hex = "0.4"
serde_json = "1.0"
