[package]
name = "shadow-crypt"
version = "0.1.0"
edition = "2024"
description = "File encryption with modern cryptography (DEVELOPMENT - NOT READY FOR PRODUCTION)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simon-amadeus/shadow"
authors = ["Simon Amadeus <code@simonamadeus.com>"]
readme = "README.md"
keywords = ["encryption", "cryptography", "file", "security", "cli"]
categories = ["command-line-utilities", "cryptography"]

# Binary targets for each use case
[[bin]]
name = "shadow"
path = "src/bin/shadow.rs"

[[bin]]
name = "unshadow"
path = "src/bin/unshadow.rs"

[[bin]]
name = "shadows"
path = "src/bin/shadows.rs"

[[bin]]
name = "shadowmigrate"
path = "src/bin/shadowmigrate.rs"

[dependencies]
# Cryptographic dependencies for Phase 3
aes-gcm = "0.10"         # AES-256-GCM authenticated encryption
chacha20poly1305 = "0.10" # XChaCha20-Poly1305 authenticated encryption
argon2 = "0.5"           # Argon2id key derivation
getrandom = "0.3"        # Secure random number generation
zeroize = "1.6"          # Secure memory zeroization
thiserror = "2.0"        # Error handling
rand = "0.9"             # Additional randomness utilities
hkdf = "0.12"            # HKDF key derivation
sha2 = "0.10"            # SHA-256 for HKDF
base64 = "0.22"          # Base64 encoding for filename obfuscation
rpassword = "7.2"        # Secure password input
sysinfo = "0.37"         # System information for memory detection
subtle = "2.5"           # Constant-time cryptographic operations
hmac = "0.12"            # HMAC for filename authentication
glob = "0.3"             # Glob pattern matching for multi-file support
rayon = "1.8"            # Parallel processing for multi-file operations
colored = "3.0"          # Modern terminal colors for enhanced UI
num_cpus = "1"        # CPU count detection for benchmarking
tempfile = "3"         # For temporary files in benchmarking
# clap = "4.0"  # For CLI parsing in later phases

[dev-dependencies]
# Testing and development dependencies
serde_json = "1.0"          # For test data serialization
tempfile = "3.8"            # For temporary file testing (updated version)
hex = "0.4"                 # For hex encoding in tests
proptest = "1.0"            # For property-based testing
