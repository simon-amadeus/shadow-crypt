[package]
name = "shadow-crypt"
version = "0.1.0"
edition = "2024"
description = "High-security file encryption system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/shadow"
authors = ["Your Name <your.email@example.com>"]

# Binary targets for each use case
[[bin]]
name = "shadow"
path = "src/bin/shadow.rs"

[[bin]]
name = "unshadow"
path = "src/bin/unshadow.rs"

[[bin]]
name = "shadows"
path = "src/bin/shadows.rs"

[[bin]]
name = "shadowview"
path = "src/bin/shadowview.rs"

[[bin]]
name = "shadowedit"
path = "src/bin/shadowedit.rs"

[[bin]]
name = "shadowmigrate"
path = "src/bin/shadowmigrate.rs"

[dependencies]
# Cryptographic dependencies for Phase 3
aes-gcm = "0.10"         # AES-256-GCM authenticated encryption
argon2 = "0.5"           # Argon2id key derivation
getrandom = "0.2"        # Secure random number generation
zeroize = "1.6"          # Secure memory zeroization
thiserror = "1.0"        # Error handling
rand = "0.8"             # Additional randomness utilities
hkdf = "0.12"            # HKDF key derivation
sha2 = "0.10"            # SHA-256 for HKDF
base64 = "0.21"          # Base64 encoding for filename obfuscation
rpassword = "7.2"        # Secure password input
sysinfo = "0.29"         # System information for memory detection
subtle = "2.5"           # Constant-time cryptographic operations
hmac = "0.12"            # HMAC for filename authentication
glob = "0.3"             # Glob pattern matching for multi-file support
# clap = "4.0"  # For CLI parsing in later phases

[dev-dependencies]
# Testing and development dependencies
serde_json = "1.0"          # For test data serialization
tempfile = "3.8"            # For temporary file testing (updated version)
hex = "0.4"                 # For hex encoding in tests
proptest = "1.0"            # For property-based testing
