name: Audit

on:
  schedule:
    # Monthly
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  outdated:
    name: Check for Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - name: Check for outdated dependencies
      run: |
        echo "## Outdated Dependencies Report" >> $GITHUB_STEP_SUMMARY
        cargo outdated --workspace --format json | jq -r '
          .dependencies[]? |
          select(.project != .latest) |
          "- \(.name): \(.project) → \(.latest)"
        ' >> $GITHUB_STEP_SUMMARY || echo "No outdated dependencies found."
    - name: Run security audit
      run: |
        echo "## Security Audit Report" >> $GITHUB_STEP_SUMMARY
        cargo audit --format json | jq -r '
          .vulnerabilities.found[]? |
          "- \(.package.name) \(.package.version): \(.title) (Advisory: \(.advisory.id))"
        ' >> $GITHUB_STEP_SUMMARY || echo "No vulnerabilities found."