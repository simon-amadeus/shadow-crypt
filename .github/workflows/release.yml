name: Release

# Automated workflow to publish crates to crates.io when a version tag is pushed
#
# How to use:
# 1. Update version in Cargo.toml files
# 2. Commit and push changes
# 3. Create and push a version tag: git tag v1.0.3 && git push origin v1.0.3
# 4. The workflow will automatically publish all crates to crates.io
#
# Safety features:
# - Only triggers on version tags (v*)
# - Verifies tag version matches Cargo.toml version
# - Publishes crates in dependency order
# - Creates GitHub release after successful publishing
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pre-publish validation
  validate:
    name: Pre-Publish Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Extract version from tag
      id: extract
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $TAG_VERSION"

    - name: Verify version matches Cargo.toml
      run: |
        EXPECTED="${{ steps.extract.outputs.version }}"
        ACTUAL=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "Version mismatch! Cargo.toml has $ACTUAL, tag is $EXPECTED"
          exit 1
        fi
        echo "✅ Version confirmed: $ACTUAL"

    - name: Verify all crates can be packaged
      run: |
        echo "Testing package creation..."
        cargo package --package shadow-crypt-core --allow-dirty > /dev/null
        cargo package --package shadow-crypt-shell --allow-dirty > /dev/null
        cargo package --package shadow-crypt --allow-dirty > /dev/null
        echo "✅ All packages can be created"

    - name: Run tests before publishing
      run: cargo test --workspace --release

  # Main publishing job - depends on validation
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: validate
    environment: release
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Publish shadow-crypt-core
      run: cargo publish --package shadow-crypt-core
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Wait for shadow-crypt-core processing
      run: sleep 30

    - name: Publish shadow-crypt-shell
      run: cargo publish --package shadow-crypt-shell
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Wait for shadow-crypt-shell processing
      run: sleep 30

    - name: Publish shadow-crypt
      run: cargo publish --package shadow-crypt
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Post-publish tasks
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ needs.validate.outputs.version }}
        body: |
          Automated release of shadow-crypt ${{ needs.validate.outputs.version }}

          This release includes updates to all workspace crates:
          - shadow-crypt-core ${{ needs.validate.outputs.version }}
          - shadow-crypt-shell ${{ needs.validate.outputs.version }}
          - shadow-crypt ${{ needs.validate.outputs.version }}

          See CHANGELOG.md for details.
        draft: false
        prerelease: false