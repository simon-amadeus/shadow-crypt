name: Release

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate & Publish
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'refs/tags/v'))
    outputs:
      version: ${{ steps.version.outputs.version }}
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch || github.ref }}"
          VERSION="${TAG#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing v$VERSION"

      - name: Verify Cargo.toml version
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "Version mismatch: Cargo.toml=$ACTUAL, tag=v$EXPECTED"
            exit 1
          }

      - name: Dry-run publish (all crates)
        run: cargo publish --workspace --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish all crates
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: Release v${{ needs.release.outputs.version }}
          body: |
            Automated release v${{ needs.release.outputs.version }}

            Published workspace crates to crates.io.

            See CHANGELOG.md
          draft: false
          prerelease: false