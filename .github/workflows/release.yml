name: Release

# Automated workflow to publish crates to crates.io when a version tag is pushed
# 
# How to use:
# 1. Update version in Cargo.toml files
# 2. Commit and push changes
# 3. Create and push a version tag: git tag v1.0.3 && git push origin v1.0.3
# 4. The workflow will automatically publish all crates to crates.io
# 
# Safety features:
# - Only triggers on version tags (v*)
# - Verifies tag version matches Cargo.toml version
# - Publishes crates in dependency order
# - Creates GitHub release after successful publishing
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # Publish all crates in the workspace to crates.io in dependency order:
    # 1. shadow-crypt-core (no dependencies)
    # 2. shadow-crypt-shell (depends on core)
    # 3. shadow-crypt (depends on shell)
    # This ensures each crate's dependencies are available when publishing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
    - name: Extract version from tag
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "Publishing version: $TAG_VERSION"
        echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
    - name: Verify version matches Cargo.toml
      run: |
        EXPECTED="${TAG_VERSION}"
        ACTUAL=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "Version mismatch! Cargo.toml has $ACTUAL, tag is $EXPECTED"
          exit 1
        fi
        echo "Version confirmed: $ACTUAL"
    - name: Publish shadow-crypt-core to crates.io
      run: cargo publish --package shadow-crypt-core
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    - name: Wait for shadow-crypt-core to be available
      run: |
        echo "Waiting 30 seconds for shadow-crypt-core to be processed..."
        sleep 30
    - name: Publish shadow-crypt-shell to crates.io
      run: cargo publish --package shadow-crypt-shell
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    - name: Wait for shadow-crypt-shell to be available
      run: |
        echo "Waiting 30 seconds for shadow-crypt-shell to be processed..."
        sleep 30
    - name: Publish shadow-crypt to crates.io
      run: cargo publish --package shadow-crypt
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ env.TAG_VERSION }}
        body: |
          Automated release of shadow-crypt ${{ env.TAG_VERSION }}

          This release includes updates to all workspace crates:
          - shadow-crypt-core ${{ env.TAG_VERSION }}
          - shadow-crypt-shell ${{ env.TAG_VERSION }}
          - shadow-crypt ${{ env.TAG_VERSION }}

          See CHANGELOG.md for details.
        draft: false
        prerelease: false