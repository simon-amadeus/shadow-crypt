name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast quality checks first
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run Clippy
      run: cargo clippy --workspace -- -D warnings

  # Core testing - depends on quality checks
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Build workspace
      run: cargo build --workspace
    - name: Run tests
      run: cargo test --workspace

  # Security and compatibility checks - run in parallel with tests
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - name: Run security audit
      run: cargo audit

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install cargo-msrv
      run: cargo install cargo-msrv --locked
    - name: Verify MSRV
      run: cargo msrv verify

  # Final status check
  ci-success:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quality, test, security, msrv]
    if: always()
    steps:
    - name: Check results
      run: |
        if [[ "${{ needs.quality.result }}" != "success" ]]; then
          echo "❌ Quality checks failed"
          exit 1
        fi
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ Tests failed"
          exit 1
        fi
        if [[ "${{ needs.security.result }}" != "success" ]]; then
          echo "❌ Security audit failed"
          exit 1
        fi
        if [[ "${{ needs.msrv.result }}" != "success" ]]; then
          echo "❌ MSRV check failed"
          exit 1
        fi
        echo "✅ All CI checks passed!"