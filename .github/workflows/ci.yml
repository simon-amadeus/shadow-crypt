name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    # Run comprehensive quality checks: formatting, linting, compilation, and testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
    - name: Check code formatting with rustfmt
      run: cargo fmt --all -- --check
    - name: Run Clippy linter to catch common mistakes
      run: cargo clippy --workspace -- -D warnings
    - name: Build all crates in the workspace
      run: cargo build --workspace
    - name: Run the full test suite
      run: cargo test --workspace

  audit:
    # Check for security vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit (security vulnerability scanner)
      run: cargo install cargo-audit
    - name: Scan dependencies for known security issues
      run: cargo audit

  msrv:
    # Verify that the project can be compiled with the Minimum Supported Rust Version (MSRV)
    # This ensures the rust-version field in Cargo.toml is accurate and prevents accidental
    # introduction of features that require newer Rust versions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-msrv (Minimum Supported Rust Version checker)
      run: cargo install cargo-msrv
    - name: Verify project compiles with specified MSRV (Rust 1.88.0)
      run: cargo msrv verify