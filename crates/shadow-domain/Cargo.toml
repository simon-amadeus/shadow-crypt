[package]
name = "shadow-domain"
version = "0.27.0"
edition = "2024"
description = "Domain logic for Shadow file encryption"

[dependencies]
# Only external dependencies allowed - no internal crate dependencies
thiserror = "2.0"
zeroize = "1.6"
subtle = "2.5"
rand = "0.9"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "rng"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.3"